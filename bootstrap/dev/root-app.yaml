apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fcourt-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SBA301-SU26-BRO73/fcourt-gitops.git
    targetRevision: main
    path: clusters/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
