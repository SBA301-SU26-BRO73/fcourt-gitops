apiVersion: v1
kind: ConfigMap
metadata:
  name: reporting-service-config
data:
  SERVER_PORT: '8084'
  REPORTING_DB_URL: '<SET_REPORTING_DB_URL>'
  REPORTING_DB_USER: 'postgres'
  KAFKA_BOOTSTRAP_SERVERS: '<SET_KAFKA_BOOTSTRAP_SERVERS>'
  REPORTING_CONSUMER_GROUP: 'reporting-service-v1'
  REPORTING_TIME_ZONE: 'Asia/Ho_Chi_Minh'
  FACILITY_URL: '<SET_FACILITY_URL>'
  AUTH_SERVICE_URL: '<SET_AUTH_SERVICE_URL>'
  SUBSCRIPTION_URL: '<SET_SUBSCRIPTION_URL>'
  AUTH_JWK_SET_URI: '<SET_AUTH_JWK_SET_URI>'
  AUTH_JWT_ISSUER: '<SET_AUTH_JWT_ISSUER>'
  AUTH_JWT_AUDIENCE: 'fcourt'
  REPORTING_KAFKA_ENABLED: 'true'
  PAYMENT_EVENTS_TOPIC: 'fcourt.payment.events'
  STAFF_EVENTS_TOPIC: 'fcourt.staff.events'
  BRANCH_UPDATED_TOPIC: 'facility.branch-updated.v1'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporting-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reporting-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reporting-service
    spec:
      serviceAccountName: reporting-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reporting-service
          image: <ECR_REGISTRY>/fcourt/reporting-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          envFrom:
            - configMapRef:
                name: reporting-service-config
          env:
            - name: REPORTING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reporting-service-secrets
                  key: REPORTING_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: reporting-service
  ports:
    - name: http
      port: 8084
      targetPort: http
      protocol: TCP

