apiVersion: v1
kind: ConfigMap
metadata:
  name: reporting-service-config
  labels:
    app.kubernetes.io/name: reporting-service
data:
  SERVER_PORT: '8084'
  REPORTING_DB_URL: "jdbc:postgresql://fcourt-postgres-rw.data.svc.cluster.local:5432/reporting_db"
  REPORTING_DB_USER: 'postgres'
  KAFKA_BOOTSTRAP_SERVERS: "fcourt-kafka-kafka-bootstrap.data.svc.cluster.local:9092"
  REPORTING_CONSUMER_GROUP: 'reporting-service-v1'
  REPORTING_TIME_ZONE: 'Asia/Ho_Chi_Minh'
  FACILITY_URL: 'http://facility-service:8083'
  AUTH_SERVICE_URL: 'http://auth-service:8081'
  SUBSCRIPTION_URL: 'http://subscription-service:8082'
  AUTH_JWK_SET_URI: 'http://auth-service:8081/.well-known/jwks.json'
  AUTH_JWT_ISSUER: 'http://auth-service:8081'
  AUTH_JWT_AUDIENCE: 'fcourt'
  REPORTING_KAFKA_ENABLED: 'true'
  PAYMENT_EVENTS_TOPIC: 'fcourt.payment.events'
  STAFF_EVENTS_TOPIC: 'fcourt.staff.events'
  BRANCH_UPDATED_TOPIC: 'facility.branch-updated.v1'
