apiVersion: v1
kind: ConfigMap
metadata:
  name: subscription-service-config
data:
  SERVER_PORT: '8082'
  SUBSCRIPTION_DATABASE_URL: '<SET_SUBSCRIPTION_DATABASE_URL>'
  SUBSCRIPTION_DATABASE_USER: 'postgres'
  SUBSCRIPTION_TIME_ZONE: 'Asia/Ho_Chi_Minh'
  PAYOS_CHECKSUM_KEY: ''
  PAYOS_API_URL: 'https://api-merchant.payos.vn'
  PAYOS_RETURN_URL: ''
  PAYOS_CANCEL_URL: ''
  PAYOS_LINK_TTL: '15m'
  PAYOS_AMOUNT_OVERRIDE: ''
  AUTH_JWK_SET_URI: '<SET_AUTH_JWK_SET_URI>'
  AUTH_JWT_ISSUER: '<SET_AUTH_JWT_ISSUER>'
  AUTH_JWT_AUDIENCE: 'fcourt'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: subscription-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscription-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: subscription-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: subscription-service
    spec:
      serviceAccountName: subscription-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: subscription-service
          image: <ECR_REGISTRY>/fcourt/subscription-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: subscription-service-config
          env:
            - name: SUBSCRIPTION_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: subscription-service-secrets
                  key: SUBSCRIPTION_DATABASE_PASSWORD
            - name: PAYOS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: subscription-service-secrets
                  key: PAYOS_CLIENT_ID
            - name: PAYOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: subscription-service-secrets
                  key: PAYOS_API_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: subscription-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: subscription-service
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: subscription-service
  annotations:
    alb.ingress.kubernetes.io/group.name: fcourt-public
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/subscriptions
            pathType: Prefix
            backend:
              service:
                name: subscription-service
                port:
                  number: 8082

