apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
components:
  - ../../../components/spring-service
  - ../../../components/alb-ingress
images:
  - name: spring-service
    newName: <ECR_REGISTRY>/fcourt/subscription-service
    newTag: dev
patches:
  - path: deployment-env.yaml
  - target:
      kind: Ingress
    patch: |-
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1group.order
        value: "10"
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        value: /api/subscriptions
      - op: replace
        path: /spec/rules/0/http/paths/0/pathType
        value: Prefix
      - op: add
        path: /spec/rules/0/http/paths/-
        value: {path: /api/subscription-plans, pathType: Prefix}
      - op: copy
        from: /spec/rules/0/http/paths/0/backend
        path: /spec/rules/0/http/paths/1/backend
      - op: add
        path: /spec/rules/0/http/paths/-
        value: {path: /api/court-types, pathType: Prefix}
      - op: copy
        from: /spec/rules/0/http/paths/0/backend
        path: /spec/rules/0/http/paths/2/backend
      - op: add
        path: /spec/rules/0/http/paths/-
        value: {path: /api/super-admin/stats/saas-revenue, pathType: Prefix}
      - op: copy
        from: /spec/rules/0/http/paths/0/backend
        path: /spec/rules/0/http/paths/3/backend
