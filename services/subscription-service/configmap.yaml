apiVersion: v1
kind: ConfigMap
metadata:
  name: subscription-service-config
  labels:
    app.kubernetes.io/name: subscription-service
data:
  SERVER_PORT: '8082'
  SUBSCRIPTION_DATABASE_URL: "jdbc:postgresql://fcourt-postgres-rw.data.svc.cluster.local:5432/subscription_db"
  SUBSCRIPTION_DATABASE_USER: 'postgres'
  SUBSCRIPTION_TIME_ZONE: 'Asia/Ho_Chi_Minh'
  PAYOS_API_URL: 'https://api-merchant.payos.vn'
  PAYOS_RETURN_URL: ''
  PAYOS_CANCEL_URL: ''
  PAYOS_LINK_TTL: '15m'
  PAYOS_AMOUNT_OVERRIDE: ''
  AUTH_JWK_SET_URI: 'http://auth-service:8081/.well-known/jwks.json'
  AUTH_JWT_ISSUER: 'http://auth-service:8081'
  AUTH_JWT_AUDIENCE: 'fcourt'
