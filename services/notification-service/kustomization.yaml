apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fcourt-prod
resources:
- configmap.yaml
components:
- ../_components/spring-service
images:
- name: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/notification-service
  newName: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/notification-service
  newTag: 7be5529
  # Point the container at the ECR image so CI can run: kustomize edit set image <repo>=<repo>:<tag>
patches:
- path: deployment-env.yaml
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/notification-service
  target:
    kind: Deployment
