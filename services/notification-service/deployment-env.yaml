apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  template:
    spec:
      containers:
        - name: notification-service
          env:
            - name: NOTIFICATION_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcourt-postgres-superuser
                  key: password
            - name: NOTIFICATION_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: notification-service-secrets
                  key: NOTIFICATION_SMTP_USER
                  optional: true
            - name: NOTIFICATION_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-service-secrets
                  key: NOTIFICATION_SMTP_PASSWORD
                  optional: true
