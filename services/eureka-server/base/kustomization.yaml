apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Service registry (Eureka). ClusterIP only: never exposed through the ALB.
# The dashboard is reachable with: kubectl -n fcourt-dev port-forward svc/eureka-server 8761:8761
resources:
  - configmap.yaml
components:
  - ../../../components/spring-service
images:
  - name: spring-service
    newName: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/eureka-server
    newTag: dev
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 640Mi
