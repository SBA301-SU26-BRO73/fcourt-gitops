apiVersion: v1
kind: ConfigMap
metadata:
  name: eureka-server-config
  labels:
    app.kubernetes.io/name: eureka-server
data:
  SERVER_PORT: '8761'
  # The registry does not register with itself or fetch from a peer (single instance).
  EUREKA_CLIENT_REGISTER_WITH_EUREKA: 'false'
  EUREKA_CLIENT_FETCH_REGISTRY: 'false'
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'true'
