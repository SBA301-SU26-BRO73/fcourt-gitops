apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fcourt-prod
# Single public entry point: the only Ingress in the cluster (ALB group fcourt-public).
# Routes to services by Kubernetes Service DNS (http://<svc>:<port>) and checks the JWT.
configMapGenerator:
- behavior: create
  envs:
  - config.env
  name: gateway-service-config
  options:
    labels:
      app.kubernetes.io/name: gateway-service
components:
- ../_components/spring-service
- ../_components/alb-ingress
images:
- name: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/gateway-service
  newName: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/gateway-service
  newTag: rebuild-20261114
      # Let WebSocket (/ws-fcourt) connections drain on gateway rollouts.
  # Point the container at the ECR image so CI can run: kustomize edit set image <repo>=<repo>:<tag>
    # Let WebSocket (/ws-fcourt) connections drain on gateway rollouts.
    # Let WebSocket (/ws-fcourt) connections drain on gateway rollouts.
patches:
- patch: |-
    # Let WebSocket (/ws-fcourt) connections drain on gateway rollouts.
    - op: add
      path: /metadata/annotations/alb.ingress.kubernetes.io~1target-group-attributes
      value: deregistration_delay.timeout_seconds=60
  target:
    kind: Ingress
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/gateway-service
  target:
    kind: Deployment
