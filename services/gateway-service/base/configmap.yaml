apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-service-config
  labels:
    app.kubernetes.io/name: gateway-service
data:
  SERVER_PORT: '8080'
  EUREKA_URL: 'http://eureka-server:8761/eureka'
  EUREKA_ENABLED: 'true'
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'true'
  AUTH_JWK_SET_URI: 'http://auth-service:8081/.well-known/jwks.json'
  AUTH_JWT_ISSUER: 'http://auth-service:8081'
  AUTH_JWT_AUDIENCE: 'fcourt'
