apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single public entry point: the only Ingress in the cluster (ALB group fcourt-public).
# Routes to services through Eureka (lb://) and checks the JWT.
resources:
  - configmap.yaml
components:
  - ../../../components/spring-service
  - ../../../components/alb-ingress
images:
  - name: spring-service
    newName: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/gateway-service
    newTag: dev
patches:
  - target:
      kind: Ingress
    patch: |-
      # Let WebSocket (/ws-fcourt) connections drain on gateway rollouts.
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1target-group-attributes
        value: deregistration_delay.timeout_seconds=60
