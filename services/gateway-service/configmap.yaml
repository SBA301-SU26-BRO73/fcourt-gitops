apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-service-config
  labels:
    app.kubernetes.io/name: gateway-service
data:
  SERVER_PORT: '8080'
  AUTH_JWK_SET_URI: 'http://auth-service:8081/.well-known/jwks.json'
  AUTH_JWT_ISSUER: 'http://auth-service:8081'
  AUTH_JWT_AUDIENCE: 'fcourt'
  REDIS_HOST: 'redis.data.svc.cluster.local'
  REDIS_PORT: '6379'
  RATE_LIMIT_ENABLED: 'true'
  # The ALB (only ingress) sets X-Forwarded-For, so its first hop is the client IP.
  RATE_LIMIT_TRUST_FORWARDED_FOR: 'true'
  RATE_LIMIT_REDIS_TIMEOUT_MS: '300'
  RATE_LIMIT_GENERAL_REQUESTS: '50'
  RATE_LIMIT_GENERAL_WINDOW_SECONDS: '1'
  RATE_LIMIT_GENERAL_BURST: '100'
  RATE_LIMIT_LOOKUP_REQUESTS: '5'
  RATE_LIMIT_LOOKUP_WINDOW_SECONDS: '60'
  RATE_LIMIT_LOOKUP_BURST: '5'
  RATE_LIMIT_AUTH_REQUESTS: '10'
  RATE_LIMIT_AUTH_WINDOW_SECONDS: '60'
  RATE_LIMIT_AUTH_BURST: '10'
