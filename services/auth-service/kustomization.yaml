apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fcourt-prod
configMapGenerator:
- name: auth-service-config
  behavior: create
  envs:
  - config.env
  options:
    labels:
      app.kubernetes.io/name: auth-service
components:
- ../_components/spring-service
images:
- name: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/auth-service
  newName: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/auth-service
  newTag: rebuild-20261114
  # Point the container at the ECR image so CI can run: kustomize edit set image <repo>=<repo>:<tag>
patches:
- path: deployment-env.yaml
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/auth-service
  target:
    kind: Deployment
