apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
data:
  SERVER_PORT: '8081'
  AUTH_DATABASE_URL: "jdbc:postgresql://fcourt-postgres-rw.data.svc.cluster.local:5432/auth_db"
  AUTH_DATABASE_USER: 'postgres'
  KAFKA_BOOTSTRAP_SERVERS: "fcourt-kafka-kafka-bootstrap.data.svc.cluster.local:9092"
  AUTH_GOOGLE_CLIENT_ID: ''
  AUTH_GOOGLE_JWK_SET_URI: 'https://www.googleapis.com/oauth2/v3/certs'
  AUTH_JWK_SET_URI: '<SET_AUTH_JWK_SET_URI>'
  AUTH_JWT_ISSUER: '<SET_AUTH_JWT_ISSUER>'
  AUTH_JWT_AUDIENCE: 'fcourt'
  AUTH_JWT_KEY_ID: ''
  AUTH_JWT_ACCESS_TTL: '15m'
  AUTH_JWT_REFRESH_TTL: '30d'
  AUTH_PASSWORD_RESET_TTL: '30m'
  AUTH_ATTEMPTS_MAX_FAILURES: '5'
  AUTH_ATTEMPTS_WINDOW: '15m'
  AUTH_ATTEMPTS_LOCK: '15m'
  AUTH_EVENTS_ENABLED: 'true'
  AUTH_EVENTS_TOPIC: 'fcourt.auth.events'
  AUTH_EVENTS_DELAY_MS: '1000'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
    spec:
      serviceAccountName: auth-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: <ECR_REGISTRY>/fcourt/auth-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: auth-service-config
          env:
            - name: AUTH_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcourt-postgres-superuser
                  key: password
            - name: AUTH_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: AUTH_JWT_PRIVATE_KEY
            - name: AUTH_CLOUDINARY_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: AUTH_CLOUDINARY_URL
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service
  annotations:
    alb.ingress.kubernetes.io/group.name: fcourt-public
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081

