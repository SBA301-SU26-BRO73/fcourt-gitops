apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  template:
    spec:
      containers:
        - name: auth-service
          env:
            - name: AUTH_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcourt-postgres-superuser
                  key: password
            - name: AUTH_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: AUTH_JWT_PRIVATE_KEY
            - name: AUTH_CLOUDINARY_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: AUTH_CLOUDINARY_URL
