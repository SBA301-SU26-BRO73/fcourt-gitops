apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Public ALB Ingress (shared group "fcourt-public"). Used ONLY by gateway-service,
# the single public entry point (path / -> gateway); every other service is
# ClusterIP-only. Name and backend port come from the service's ConfigMap
# (label app.kubernetes.io/name and SERVER_PORT).
resources:
  - ingress.yaml
replacements:
  - source:
      kind: ConfigMap
      fieldPath: metadata.labels.[app.kubernetes.io/name]
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - metadata.name
          - spec.rules.0.http.paths.0.backend.service.name
  - source:
      kind: ConfigMap
      fieldPath: data.SERVER_PORT
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.rules.0.http.paths.0.backend.service.port.number
