apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
components:
  - ../../../components/spring-service
  - ../../../components/alb-ingress
images:
  - name: spring-service
    newName: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/booking-service
    newTag: dev
patches:
  - path: deployment-env.yaml
  - target:
      kind: Ingress
    patch: |-
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1group.order
        value: "20"
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1target-group-attributes
        value: deregistration_delay.timeout_seconds=60
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        value: /api/bookings
      - op: replace
        path: /spec/rules/0/http/paths/0/pathType
        value: Prefix
      - op: add
        path: /spec/rules/0/http/paths/-
        value: {path: /api/admin/bookings, pathType: Prefix}
      - op: copy
        from: /spec/rules/0/http/paths/0/backend
        path: /spec/rules/0/http/paths/1/backend
      - op: add
        path: /spec/rules/0/http/paths/-
        value: {path: /ws-fcourt, pathType: Prefix}
      - op: copy
        from: /spec/rules/0/http/paths/0/backend
        path: /spec/rules/0/http/paths/2/backend
  - target:
      kind: Service
    patch: |-
      - op: add
        path: /spec/ports/-
        value: {name: grpc, port: 9088, targetPort: 9088, protocol: TCP}
