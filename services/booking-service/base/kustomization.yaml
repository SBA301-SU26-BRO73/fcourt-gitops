apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
components:
  - ../../../components/spring-service
images:
  - name: spring-service
    newName: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/booking-service
    newTag: dev
patches:
  - path: deployment-env.yaml
  - target:
      kind: Service
    patch: |-
      - op: add
        path: /spec/ports/-
        value: {name: grpc, port: 9088, targetPort: 9088, protocol: TCP}
