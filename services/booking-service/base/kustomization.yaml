apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
components:
  - ../../../components/spring-service
  - ../../../components/alb-ingress
images:
  - name: spring-service
    newName: <ECR_REGISTRY>/fcourt/booking-service
    newTag: dev
patches:
  - path: deployment-env.yaml
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        value: /api/bookings
