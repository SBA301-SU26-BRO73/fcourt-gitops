apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  template:
    spec:
      containers:
        - name: payment-service
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcourt-postgres-superuser
                  key: password
            - name: CLOUDINARY_URL
              valueFrom:
                secretKeyRef:
                  name: payment-service-secrets
                  key: CLOUDINARY_URL
