apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
components:
  - ../../../components/spring-service
  - ../../../components/alb-ingress
images:
  - name: spring-service
    newName: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/pos-retail-service
    newTag: dev
patches:
  - path: deployment-env.yaml
  - target:
      kind: Ingress
    patch: |-
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1group.order
        value: "10"
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        value: /api/staff/pos
      - op: replace
        path: /spec/rules/0/http/paths/0/pathType
        value: Prefix
      - op: add
        path: /spec/rules/0/http/paths/-
        value: {path: /api/admin/pos, pathType: Prefix}
      - op: copy
        from: /spec/rules/0/http/paths/0/backend
        path: /spec/rules/0/http/paths/1/backend
