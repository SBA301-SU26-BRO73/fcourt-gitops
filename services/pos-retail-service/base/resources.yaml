apiVersion: v1
kind: ConfigMap
metadata:
  name: pos-retail-service-config
data:
  SERVER_PORT: '8092'
  POS_DATABASE_URL: '<SET_POS_DATABASE_URL>'
  POS_DATABASE_USER: 'postgres'
  KAFKA_BOOTSTRAP_SERVERS: '<SET_KAFKA_BOOTSTRAP_SERVERS>'
  AUTH_URL: '<SET_AUTH_URL>'
  STAFF_URL: '<SET_STAFF_URL>'
  FACILITY_URL: '<SET_FACILITY_URL>'
  BOOKING_URL: '<SET_BOOKING_URL>'
  AUTH_JWK_SET_URI: '<SET_AUTH_JWK_SET_URI>'
  AUTH_JWT_ISSUER: '<SET_AUTH_JWT_ISSUER>'
  AUTH_JWT_AUDIENCE: 'fcourt'
  POS_DISPATCH_ENABLED: 'true'
  POS_EVENTS_TOPIC: 'fcourt.pos.events'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pos-retail-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-retail-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pos-retail-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pos-retail-service
    spec:
      serviceAccountName: pos-retail-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pos-retail-service
          image: <ECR_REGISTRY>/fcourt/pos-retail-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8092
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pos-retail-service-config
          env:
            - name: POS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pos-retail-service-secrets
                  key: POS_DATABASE_PASSWORD
            - name: POS_BOOKING_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pos-retail-service-secrets
                  key: POS_BOOKING_SERVICE_TOKEN
            - name: POS_SETTLEMENT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pos-retail-service-secrets
                  key: POS_SETTLEMENT_SERVICE_TOKEN
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pos-retail-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pos-retail-service
  ports:
    - name: http
      port: 8092
      targetPort: http
      protocol: TCP

