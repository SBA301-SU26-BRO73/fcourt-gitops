apiVersion: v1
kind: ConfigMap
metadata:
  name: voucher-service-config
data:
  SERVER_PORT: '8086'
  KAFKA_BOOTSTRAP_SERVERS: '<SET_KAFKA_BOOTSTRAP_SERVERS>'
  DATABASE_URL: '<SET_DATABASE_URL>'
  DATABASE_USER: 'postgres'
  FACILITY_URL: '<SET_FACILITY_URL>'
  AUTH_JWK_SET_URI: '<SET_AUTH_JWK_SET_URI>'
  AUTH_JWT_ISSUER: '<SET_AUTH_JWT_ISSUER>'
  AUTH_JWT_AUDIENCE: 'fcourt'
  VOUCHER_GRPC_ENABLED: 'true'
  VOUCHER_GRPC_HOST: '127.0.0.1'
  VOUCHER_GRPC_PORT: '9086'
  VOUCHER_GRPC_CERTIFICATE: ''
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: voucher-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voucher-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: voucher-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voucher-service
    spec:
      serviceAccountName: voucher-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: voucher-service
          image: <ECR_REGISTRY>/fcourt/voucher-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          envFrom:
            - configMapRef:
                name: voucher-service-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voucher-service-secrets
                  key: DATABASE_PASSWORD
            - name: VOUCHER_GRPC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: voucher-service-secrets
                  key: VOUCHER_GRPC_TOKEN
            - name: VOUCHER_GRPC_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: voucher-service-secrets
                  key: VOUCHER_GRPC_PRIVATE_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: voucher-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: voucher-service
  ports:
    - name: http
      port: 8086
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voucher-service
  annotations:
    alb.ingress.kubernetes.io/group.name: fcourt-public
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/vouchers
            pathType: Prefix
            backend:
              service:
                name: voucher-service
                port:
                  number: 8086

