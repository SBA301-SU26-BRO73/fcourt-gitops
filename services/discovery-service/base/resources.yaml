apiVersion: v1
kind: ConfigMap
metadata:
  name: discovery-service-config
data:
  SERVER_PORT: '8085'
  REDIS_HOST: "redis.data.svc.cluster.local"
  REDIS_PORT: '6379'
  DISCOVERY_DB_URL: "jdbc:postgresql://fcourt-postgres-rw.data.svc.cluster.local:5432/discovery_db"
  DISCOVERY_DB_USER: 'postgres'
  KAFKA_BOOTSTRAP_SERVERS: "fcourt-kafka-kafka-bootstrap.data.svc.cluster.local:9092"
  STORAGE_PROVIDER: 'cloudinary'
  STORAGE_PUBLIC_BASE_URL: ''
  CLOUDINARY_CLOUD_NAME: ''
  AUTH_JWK_SET_URI: '<SET_AUTH_JWK_SET_URI>'
  AUTH_JWT_ISSUER: '<SET_AUTH_JWT_ISSUER>'
  AUTH_JWT_AUDIENCE: 'fcourt'
  AUTH_URL: '<SET_AUTH_URL>'
  DISCOVERY_REVIEW_UPLOAD_MAX_FILES: '20'
  DISCOVERY_REVIEW_UPLOAD_WINDOW_SECONDS: '600'
  DISCOVERY_REVIEW_CLEANUP_ENABLED: 'true'
  DISCOVERY_REVIEW_CLEANUP_DRY_RUN: 'true'
  DISCOVERY_REVIEW_CLEANUP_MIN_AGE_HOURS: '24'
  DISCOVERY_REVIEW_CLEANUP_CRON: '0 30 3 * * *'
  FACILITY_URL: '<SET_FACILITY_URL>'
  BOOKING_URL: '<SET_BOOKING_URL>'
  DISCOVERY_CACHE_TTL_SECONDS: '5'
  BRANCH_UPDATED_TOPIC: 'facility.branch-updated.v1'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discovery-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discovery-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discovery-service
    spec:
      serviceAccountName: discovery-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: discovery-service
          image: <ECR_REGISTRY>/fcourt/discovery-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
          envFrom:
            - configMapRef:
                name: discovery-service-config
          env:
            - name: DISCOVERY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discovery-service-secrets
                  key: DISCOVERY_DB_PASSWORD
            - name: CLOUDINARY_URL
              valueFrom:
                secretKeyRef:
                  name: discovery-service-secrets
                  key: CLOUDINARY_URL
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: discovery-service-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: discovery-service-secrets
                  key: CLOUDINARY_API_SECRET
            - name: DISCOVERY_INTERNAL_SLOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discovery-service-secrets
                  key: DISCOVERY_INTERNAL_SLOT_TOKEN
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: discovery-service
  ports:
    - name: http
      port: 8085
      targetPort: http
      protocol: TCP
