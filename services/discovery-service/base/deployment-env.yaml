apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
spec:
  template:
    spec:
      containers:
        - name: discovery-service
          env:
            - name: DISCOVERY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discovery-service-secrets
                  key: DISCOVERY_DB_PASSWORD
            - name: CLOUDINARY_URL
              valueFrom:
                secretKeyRef:
                  name: discovery-service-secrets
                  key: CLOUDINARY_URL
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: discovery-service-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: discovery-service-secrets
                  key: CLOUDINARY_API_SECRET
            - name: DISCOVERY_INTERNAL_SLOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discovery-service-secrets
                  key: DISCOVERY_INTERNAL_SLOT_TOKEN
