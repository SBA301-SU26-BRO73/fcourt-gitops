apiVersion: v1
kind: ConfigMap
metadata:
  name: discovery-service-config
  labels:
    app.kubernetes.io/name: discovery-service
data:
  SERVER_PORT: '8085'
  REDIS_HOST: "redis.data.svc.cluster.local"
  REDIS_PORT: '6379'
  DISCOVERY_DB_URL: "jdbc:postgresql://fcourt-postgres-rw.data.svc.cluster.local:5432/discovery_db"
  DISCOVERY_DB_USER: 'postgres'
  KAFKA_BOOTSTRAP_SERVERS: "fcourt-kafka-kafka-bootstrap.data.svc.cluster.local:9092"
  AUTH_JWK_SET_URI: 'http://auth-service:8081/.well-known/jwks.json'
  AUTH_JWT_ISSUER: 'http://auth-service:8081'
  AUTH_JWT_AUDIENCE: 'fcourt'
  AUTH_URL: 'http://auth-service:8081'
  DISCOVERY_REVIEW_UPLOAD_MAX_FILES: '20'
  DISCOVERY_REVIEW_UPLOAD_WINDOW_SECONDS: '600'
  DISCOVERY_REVIEW_CLEANUP_ENABLED: 'true'
  DISCOVERY_REVIEW_CLEANUP_DRY_RUN: 'true'
  DISCOVERY_REVIEW_CLEANUP_MIN_AGE_HOURS: '24'
  DISCOVERY_REVIEW_CLEANUP_CRON: '0 30 3 * * *'
  FACILITY_URL: 'http://facility-service:8083'
  BOOKING_URL: 'http://booking-service:8088'
  DISCOVERY_CACHE_TTL_SECONDS: '5'
  BRANCH_UPDATED_TOPIC: 'facility.branch-updated.v1'
  STORAGE_S3_BUCKET: 'fcourt-prod-media-870853685410'
  STORAGE_S3_REGION: 'ap-southeast-1'
  STORAGE_PUBLIC_BASE_URL: 'https://fcourt-prod-media-870853685410.s3.ap-southeast-1.amazonaws.com'
