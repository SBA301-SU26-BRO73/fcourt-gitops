apiVersion: v1
kind: ConfigMap
metadata:
  name: slot-hold-engine-config
  labels:
    app.kubernetes.io/name: slot-hold-engine
data:
  SERVER_PORT: '8087'
  REDIS_ADDRESS: "redis://redis.data.svc.cluster.local:6379"
  DISCOVERY_URL: 'http://discovery-service:8085'
  EUREKA_URL: 'http://eureka-server:8761/eureka'
  EUREKA_ENABLED: 'true'
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'true'
