apiVersion: v1
kind: ConfigMap
metadata:
  name: staff-operations-service-config
  labels:
    app.kubernetes.io/name: staff-operations-service
data:
  SERVER_PORT: '8090'
  STAFF_DATABASE_URL: "jdbc:postgresql://fcourt-postgres-rw.data.svc.cluster.local:5432/staff_db"
  STAFF_DATABASE_USER: 'postgres'
  KAFKA_BOOTSTRAP_SERVERS: "fcourt-kafka-kafka-bootstrap.data.svc.cluster.local:9092"
  STAFF_ENDING_SOON_MINUTES: '10'
  HOLD_GRPC_TARGET: 'slot-hold-engine:9087'
  BOOKING_GRPC_TARGET: 'booking-service:9088'
  STAFF_GRPC_PLAINTEXT: 'true' # in-cluster dev traffic, no TLS between pods
  STAFF_GRPC_DEADLINE_MS: '2000'
  WALK_IN_FIXED_SURCHARGE: '0'
  WALK_IN_SURCHARGE_PERCENT: '0'
  WALK_IN_PRICING_POLICY: 'counter-v1'
  STAFF_TIME_ZONE: 'Asia/Ho_Chi_Minh'
  BOOKING_URL: 'http://booking-service:8088'
  DISCOVERY_URL: 'http://discovery-service:8085'
  STAFF_EVENTS_ENABLED: 'true'
  STAFF_EVENTS_TOPIC: 'fcourt.staff.events'
  AUTH_URL: 'http://auth-service:8081'
  AUTH_JWK_SET_URI: 'http://auth-service:8081/.well-known/jwks.json'
  AUTH_JWT_ISSUER: 'http://auth-service:8081'
  AUTH_JWT_AUDIENCE: 'fcourt'
  FACILITY_URL: 'http://facility-service:8083'
