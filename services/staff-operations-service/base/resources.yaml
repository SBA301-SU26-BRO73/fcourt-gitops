apiVersion: v1
kind: ConfigMap
metadata:
  name: staff-operations-service-config
data:
  SERVER_PORT: '8090'
  STAFF_DATABASE_URL: "jdbc:postgresql://fcourt-postgres-rw.data.svc.cluster.local:5432/staff_db"
  STAFF_DATABASE_USER: 'postgres'
  KAFKA_BOOTSTRAP_SERVERS: "fcourt-kafka-kafka-bootstrap.data.svc.cluster.local:9092"
  STAFF_ENDING_SOON_MINUTES: '10'
  HOLD_GRPC_TARGET: '<SET_HOLD_GRPC_TARGET>'
  BOOKING_GRPC_TARGET: '<SET_BOOKING_GRPC_TARGET>'
  STAFF_GRPC_PLAINTEXT: 'false'
  STAFF_GRPC_DEADLINE_MS: '2000'
  WALK_IN_FIXED_SURCHARGE: '0'
  WALK_IN_SURCHARGE_PERCENT: '0'
  WALK_IN_PRICING_POLICY: 'counter-v1'
  STAFF_TIME_ZONE: 'Asia/Ho_Chi_Minh'
  BOOKING_URL: '<SET_BOOKING_URL>'
  DISCOVERY_URL: '<SET_DISCOVERY_URL>'
  STAFF_EVENTS_ENABLED: 'true'
  STAFF_EVENTS_TOPIC: 'fcourt.staff.events'
  AUTH_URL: '<SET_AUTH_URL>'
  AUTH_JWK_SET_URI: '<SET_AUTH_JWK_SET_URI>'
  AUTH_JWT_ISSUER: '<SET_AUTH_JWT_ISSUER>'
  AUTH_JWT_AUDIENCE: 'fcourt'
  FACILITY_URL: '<SET_FACILITY_URL>'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: staff-operations-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staff-operations-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: staff-operations-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: staff-operations-service
    spec:
      serviceAccountName: staff-operations-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: staff-operations-service
          image: <ECR_REGISTRY>/fcourt/staff-operations-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: staff-operations-service-config
          env:
            - name: STAFF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcourt-postgres-superuser
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: staff-operations-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: staff-operations-service
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP

