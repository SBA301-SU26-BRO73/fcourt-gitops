apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fcourt-prod
resources:
  - configmap.yaml
components:
  - ../_components/spring-service
images:
  - name: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/staff-operations-service
    newName: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/staff-operations-service
    newTag: dev
patches:
  - path: deployment-env.yaml
  # Point the container at the ECR image so CI can run: kustomize edit set image <repo>=<repo>:<tag>
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: 870853685410.dkr.ecr.ap-southeast-1.amazonaws.com/fcourt/staff-operations-service
