apiVersion: v1
kind: ConfigMap
metadata:
  name: facility-service-config
  labels:
    app.kubernetes.io/name: facility-service
data:
  SERVER_PORT: '8083'
  FACILITY_DB_URL: "jdbc:postgresql://fcourt-postgres-rw.data.svc.cluster.local:5432/facility_db"
  FACILITY_DB_USER: 'postgres'
  KAFKA_BOOTSTRAP_SERVERS: "fcourt-kafka-kafka-bootstrap.data.svc.cluster.local:9092"
  REDIS_HOST: "redis.data.svc.cluster.local"
  REDIS_PORT: '6379'
  FACILITY_REALTIME_ENABLED: 'false'
  AUTH_JWK_SET_URI: 'http://auth-service:8081/.well-known/jwks.json'
  AUTH_JWT_ISSUER: 'http://auth-service:8081'
  AUTH_JWT_AUDIENCE: 'fcourt'
  # Plan limits from subscription-service (owners without a live plan get its free defaults 3/15); empty = defaults below.
  SUBSCRIPTION_BASE_URL: http://subscription-service:8082
  SUBSCRIPTION_DEFAULT_MAX_BRANCHES: '3'
  SUBSCRIPTION_DEFAULT_MAX_COURTS: '15'
  FACILITY_IMAGES_MAX_PER_BRANCH: '10'
  FACILITY_IMAGES_MAX_FILE_BYTES: '5242880'
  DISCOVERY_BASE_URL: 'http://discovery-service:8085'
  FACILITY_RESERVATION_SWEEP_MS: '15000'
  FACILITY_EVENTS_ENABLED: 'true'
  BRANCH_UPDATED_TOPIC: 'facility.branch-updated.v1'
  BRANCH_UPDATED_TOPIC_PARTITIONS: '3'
  FACILITY_OUTBOX_DELAY_MS: '1000'
  FACILITY_BOOTSTRAP_SNAPSHOTS: 'true'
  STORAGE_S3_BUCKET: 'fcourt-prod-media-870853685410'
  STORAGE_S3_REGION: 'ap-southeast-1'
  STORAGE_PUBLIC_BASE_URL: 'https://fcourt-prod-media-870853685410.s3.ap-southeast-1.amazonaws.com'
