apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fcourt-postgres
  namespace: data
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
  storage:
    storageClass: gp3
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
