apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fcourt-postgres
  namespace: data
spec:
  instances: 1
  enableSuperuserAccess: true
  enablePDB: false
  superuserSecret:
    name: fcourt-postgres-superuser
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  postgresql:
    parameters:
      max_connections: "250"
  storage:
    storageClass: gp3
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
