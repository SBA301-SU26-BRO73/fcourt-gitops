# Minimal Argo CD for a 2-node dev cluster. Chart version is pinned in scripts/bootstrap-argocd.sh.
global:
  domain: ""
configs:
  params:
    server.insecure: true # no TLS/ingress in dev; reach it with kubectl port-forward
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
controller:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
server:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
repoServer:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
redis:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 128Mi}
