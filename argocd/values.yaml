# Minimal Argo CD for the 2-node fcourt-prod cluster. Chart version is pinned in scripts/bootstrap-argocd.sh.
global:
  domain: ""
configs:
  params:
    server.insecure: true # no TLS/ingress; reach it with kubectl port-forward
  cm:
    # Lets sync-waves wait for child Applications to become Healthy.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
controller:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
server:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
repoServer:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
redis:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 128Mi}
