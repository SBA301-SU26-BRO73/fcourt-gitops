apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Content of the single root Application (root-app.yaml points at this folder).
# Sync waves: AppProjects and StorageClass -1, platform Applications 0, services ApplicationSet 1.
# root-app.yaml itself is applied by hand once (scripts/bootstrap-argocd.sh) and is not listed here.
resources:
  - projects.yaml
  - ../platform/storage
  - ../platform/aws-load-balancer-controller
  - ../platform/postgres
  - ../platform/kafka
  - ../platform/redis
  - services-appset.yaml
