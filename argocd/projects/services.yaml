apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services
  namespace: argocd
spec:
  description: FCourt application services in dev and production namespaces
  sourceRepos:
    - https://github.com/SBA301-SU26-BRO73/fcourt-gitops.git
  destinations:
    - namespace: fcourt-dev
      server: https://kubernetes.default.svc
    - namespace: fcourt-prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
