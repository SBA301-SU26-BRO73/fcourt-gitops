apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Entry point for the dev cluster (bootstrap/dev/root-app.yaml points here).
# Sync waves: AppProjects -1, platform Applications 0, services ApplicationSet 1.
resources:
  # AppProjects
  - ../../projects
  - ../../platform/storage
  # Platform add-ons shared with prod
  - ../../platform/aws-load-balancer-controller
  - ../../platform/external-secrets
  - ../../platform/metrics-server
  # DEV ONLY: in-cluster data (prod uses RDS / MSK / ElastiCache)
  - ../../platform/dev-data/cloudnative-pg
  - ../../platform/dev-data/strimzi
  - ../../platform/dev-data/redis
  # Application services (services/*/overlays/dev)
  - services-appset.yaml
patches:
  # DEV ONLY: let the platform AppProject install the in-cluster data components
  - path: platform-project-dev.patch.yaml
    target:
      group: argoproj.io
      kind: AppProject
      name: platform
