apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fcourt-services-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  generators:
    - git:
        repoURL: https://github.com/SBA301-SU26-BRO73/fcourt-gitops.git
        revision: main
        directories:
          - path: services/*/overlays/prod
  template:
    metadata:
      name: 'fcourt-{{path[1]}}-prod'
    spec:
      project: services
      source:
        repoURL: https://github.com/SBA301-SU26-BRO73/fcourt-gitops.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: fcourt-prod
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
