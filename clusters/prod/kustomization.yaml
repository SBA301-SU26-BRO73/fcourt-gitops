apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Entry point for the prod cluster (bootstrap/prod/root-app.yaml points here).
# Sync waves: AppProjects -1, platform Applications 0, Eureka 1, services 2, gateway 3.
# No in-cluster data components: prod uses RDS, MSK and ElastiCache.
resources:
  # AppProjects
  - ../../projects
  - ../../platform/storage
  # Platform add-ons shared with dev
  - ../../platform/aws-load-balancer-controller
  - ../../platform/external-secrets
  - ../../platform/metrics-server
  # Application services (services/*/overlays/prod)
  - eureka-appset.yaml
  - services-appset.yaml
  - gateway-appset.yaml
